services:
  user-management-service:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://nodepay_user:secretpassword@db:5432/nodepay_db?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    depends_on:
      - db

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://nodepay_user:secretpassword@db:5432/nodepay_db?schema=public
    volumes:
      - ./ai-service:/app
    depends_on:
      - db

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    environment:
      - KEYCLOAK_ADMIN=adminkc
      - KEYCLOAK_ADMIN_PASSWORD=adminkc
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/nodepay_db
      - KC_DB_USERNAME=nodepay_user
      - KC_DB_PASSWORD=secretpassword
      - KC_DB_SCHEMA=auth
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nodepay_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: nodepay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  pgdata:
